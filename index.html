<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pick</title>
  <meta name="description" content="Pick – weniger grübeln, mehr machen. Unser Helfer für Essen, Einkauf und alles, was den Kopf voll macht.">
  <meta name="theme-color" content="#EEF4F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#031530" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pick">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="dish" class="locked">
  <!-- STARTSEITE: sichtbar, solange niemand angemeldet ist -->
  <section class="gate" id="gate" aria-label="Anmelden">
    <div class="gate-fan" aria-hidden="true">
      <div class="gf gf1"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg></div>
      <div class="gf gf2"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div>
      <div class="gf gf3"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <h1 class="gate-logo"><img src="images/brand/pick-symbol.png" alt="" width="56" height="56">Pick</h1>
    <p class="gate-slogan">Weniger grübeln. Mehr machen.</p>
    <p class="gate-sub">Unser kleiner Helfer für alles, was den Kopf voll macht.</p>
    <form class="gate-form" id="gate-form" autocomplete="on">
      <input class="input" id="g-mail" name="email" type="email" inputmode="email" autocomplete="username" placeholder="E-Mail" required>
      <input class="input" id="g-pass" name="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
      <p class="gate-err" id="g-err" role="alert" hidden></p>
      <button class="btn btn-primary" id="g-btn" type="submit">Anmelden</button>
    </form>
    <p class="gate-foot">Private App – Zugang nur für uns zwei.</p>
  </section>

  <div class="status-shade" aria-hidden="true"></div>
  <div class="app">

    <!-- HEUTE: Startseite mit allen Helfern -->
    <section class="view page active" id="view-home" aria-label="Heute">
      <header class="bar">
        <div class="logo"><img src="images/brand/pick-symbol.png" alt="" width="30" height="30">Pick</div>
        <div class="avatars" id="avatars"></div>
      </header>
      <div id="home"></div>
    </section>

    <!-- ESSEN: Kartenstapel -->
    <section class="view" id="view-today" aria-label="Essen">
      <header class="bar">
        <h1 class="page-title">Essen</h1>
        <button class="duel-pill" id="duel-start" data-duel hidden>⚔️ Duell</button>
        <button class="icon-btn" data-view="list" aria-label="Sammlung: Gerichte und Orte"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg></button>
      </header>
      <div class="seg seg-mode" role="tablist" aria-label="Was wollt ihr?">
        <button role="tab" class="seg-btn active" data-mode="dish" aria-selected="true">Kochen</button>
        <button role="tab" class="seg-btn" data-mode="place" aria-selected="false">Auswärts</button>
        <button role="tab" class="seg-btn" data-mode="mix" aria-selected="false">🎲 Zufall</button>
      </div>
      <div class="deck" id="deck" aria-live="polite"></div>
      <div class="controls" id="controls"></div>
    </section>

    <!-- SAMMLUNG (Unterseite von Essen) -->
    <section class="view page" id="view-list" aria-label="Sammlung">
      <header class="bar">
        <button class="icon-btn" data-view="today" aria-label="Zurück zu Essen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h1 class="page-title">Sammlung</h1>
      </header>
      <div class="seg" role="tablist" aria-label="Liste">
        <button role="tab" class="seg-btn list-seg active" data-kind="dish">Gerichte <span class="count" id="count-dish"></span></button>
        <button role="tab" class="seg-btn list-seg" data-kind="place">Orte <span class="count" id="count-place"></span></button>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" id="search" placeholder="Suchen …" autocomplete="off">
      </label>
      <ul class="grid" id="list"></ul>
      <button class="fab" id="fab" aria-label="Neu hinzufügen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span id="fab-label">Gericht</span>
      </button>
    </section>

    <!-- EINKAUF -->
    <section class="view page" id="view-shop" aria-label="Einkauf">
      <header class="bar"><h1 class="page-title">Einkauf</h1></header>
      <div id="shop"></div>
    </section>

    <!-- AUFGABEN -->
    <section class="view page" id="view-tasks" aria-label="Aufgaben">
      <header class="bar">
        <h1 class="page-title">Aufgaben</h1>
        <button class="icon-btn" data-task-new aria-label="Neue Aufgabe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </header>
      <div class="seg" role="tablist" aria-label="Ansicht">
        <button role="tab" class="seg-btn task-seg active" data-tview="next">Nächstes</button>
        <button role="tab" class="seg-btn task-seg" data-tview="all">Alle</button>
        <button role="tab" class="seg-btn task-seg" data-tview="done">Erledigt</button>
      </div>
      <div id="tasks"></div>
    </section>

    <!-- ALLE: alle Helfer, Profil, Einstellungen -->
    <section class="view page" id="view-all" aria-label="Alle">
      <header class="bar"><h1 class="page-title">Alle</h1></header>
      <div id="more"></div>
    </section>

    <!-- Leiste unten -->
    <nav class="tabbar" id="tabbar" aria-label="Bereiche">
      <button class="tab" data-view="home"><span class="ti">🏠</span>Heute</button>
      <button class="tab" data-view="today"><span class="ti">🍽️</span>Essen</button>
      <button class="tab" data-view="shop"><span class="ti">🛒</span>Einkauf<span class="tab-badge" id="shop-badge" hidden></span></button>
      <button class="tab" data-view="tasks"><span class="ti">✅</span>Aufgaben<span class="tab-badge" id="task-badge" hidden></span></button>
      <button class="tab" data-view="all"><span class="ti">☰</span>Alle</button>
    </nav>
  </div>

  <div class="duel" id="duel" role="dialog" aria-modal="true" aria-label="Pick-Duell" hidden></div>
  <div class="backdrop" id="backdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
